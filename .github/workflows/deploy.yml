name: Test and Deploy API

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      APP_DIR: /opt/cards-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Explain a skipped deploy
        if: github.event_name == 'push' && env.SSH_HOST == ''
        run: echo "::warning::Deploy skipped. Add SSH_HOST, SSH_USER, and SSH_PRIVATE_KEY repository secrets."

      - name: Set up SSH
        if: github.event_name == 'push' && env.SSH_HOST != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy the API code to the droplet
        if: github.event_name == 'push' && env.SSH_HOST != ''
        run: >
          rsync -az --delete --no-owner --no-group
          --exclude '.git/' --exclude '.github/' --exclude 'node_modules/'
          --exclude '.env' --exclude 'tests/' --exclude 'api-tests/' --exclude 'tutorials/'
          -e "ssh -i $HOME/.ssh/deploy_key"
          ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Install and restart on the droplet
        if: github.event_name == 'push' && env.SSH_HOST != ''
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            export XDG_RUNTIME_DIR=/run/user/\$(id -u)
            cd $APP_DIR
            NODE_VERSION=26 ~/.nvm/nvm-exec npm ci --omit=dev
            systemctl --user restart cards-api
            curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://localhost:5001/api/ping
          "
